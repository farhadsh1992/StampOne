name: StampOne_keras3
python_version: "3.9"
dependencies:
  - cudatoolkit
  - python >= 3.8
  - pip
  - numpy
  - matplotlib
  - pendulum
  - psutil
  - requests
  - pillow
  - scikit-image
  - scikit-learn
  - six
  - pip:
    - tensorflow>=2.16
    - keras>=3.1
    - opencv-python
    - tensorflow-addons
    - tflite-runtime
    - dlib
    - bchlib
    - reedsolo
    - pandas
    - jax
    # Only needed to re-run the vendored LPIPS PyTorch->TF conversion scripts
    # in loss_functions_lib/lpipstf/ and loss_functions_lib/lpips_model/lpips-tensorflow/
    - torch
    - onnx
    - onnx-tf

